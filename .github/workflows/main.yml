name: Tests
env:
  # Les tests unitaires mockent Prisma : aucune base de données n'est requise.
  # Seul JWT_SECRET est nécessaire (signature d'un token dans users.usecase.test.ts).
  JWT_SECRET: ${{ secrets.JWT_SECRET }}

on:
  deployment_status:
jobs:
  tests:
    name: e2e & units tests
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm prisma generate
      - run: pnpm test
